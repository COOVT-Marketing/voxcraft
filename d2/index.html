<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ringba RTB Transfer</title>
<style>
  :root{
    --bg:#f3f4f6; --panel:#ffffff; --ink:#111827; --sub:#6b7280; --line:#d9dce1;
    --accent:#1d4ed8; --accent-d:#1e40af; --good:#166534; --good-bg:#ecfdf3; --good-line:#b7e4c7;
    --bad:#991b1b; --bad-bg:#fef2f2; --bad-line:#f5c2c2;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:baseline;gap:10px}
  header b{font-size:17px;letter-spacing:.2px}
  header span{color:var(--sub);font-size:12.5px}
  main{max-width:520px;margin:22px auto;padding:0 14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:14px}
  .panel h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--sub);font-weight:600}
  label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
  label:first-of-type{margin-top:0}
  input,select{width:100%;height:38px;padding:0 10px;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px}
  input::placeholder{color:#9aa1ad}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,78,216,.15)}
  input.err,select.err{border-color:#dc2626}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:460px){.two{grid-template-columns:1fr}}
  .btn{display:block;width:100%;height:40px;margin-top:16px;border:0;border-radius:6px;background:var(--accent);color:#fff;font:600 14px inherit;font-family:inherit;cursor:pointer}
  .btn:hover:not(:disabled){background:var(--accent-d)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:10px}
  .btn.ghost:hover:not(:disabled){background:#f9fafb}
  .box{margin-top:14px;padding:11px 13px;border-radius:6px;border:1px solid;font-size:13.5px}
  .box.good{background:var(--good-bg);border-color:var(--good-line);color:var(--good)}
  .box.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
  .line{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
  .line + .line{border-top:1px solid rgba(22,101,52,.15)}
  .line span{color:#3f6b4f}
  .line b{color:var(--ink);font-weight:600;text-align:right;overflow-wrap:anywhere}
  .did-label{font-size:12px;color:#3f6b4f;margin-bottom:2px}
  .number{font-size:24px;font-weight:700;color:var(--ink);letter-spacing:.5px;margin:2px 0 4px}
  .bid-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid rgba(22,101,52,.15);gap:12px;flex-wrap:wrap}
  .bid-amount{font-size:20px;font-weight:700;color:var(--ink)}
  .bid-label{font-size:12px;color:#3f6b4f}
  .meta{font-size:12px;color:#3f6b4f;margin-top:8px}
  .raw-toggle{margin-top:12px;font-size:12.5px;color:var(--accent);cursor:pointer;background:none;border:0;padding:0;font-family:inherit;font-weight:600}
  .raw-toggle:hover{text-decoration:underline}
  .raw-box{display:none;margin-top:8px;padding:10px;background:#0f172a;color:#e2e8f0;border-radius:6px;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto}
  .raw-box.open{display:block}
</style>
</head>
<body>
<header>
  <b>Ringba RTB Transfer</b>
  <span>Windows · Bath · Roofing</span>
</header>

<main>
  <section class="panel">
    <h2>Send Transfer</h2>
    <form id="rtbForm" novalidate autocomplete="off">
      <label for="service">Service</label>
      <select id="service" required>
        <option value="" disabled selected>Select service</option>
        <option value="windows">Windows</option>
        <option value="bath">Bath</option>
        <option value="roofing">Roofing</option>
      </select>

      <div class="two">
        <div>
          <label for="cid">Caller ID (CID)</label>
          <input id="cid" type="tel" inputmode="tel" placeholder="18885557777">
        </div>
        <div>
          <label for="zipcode">ZIP code</label>
          <input id="zipcode" type="text" inputmode="numeric" maxlength="5" placeholder="99999">
        </div>
      </div>

      <button class="btn" id="submitBtn" type="submit">Submit</button>
    </form>

    <div id="out" aria-live="polite"></div>
  </section>
</main>

<script>
(function(){
  "use strict";

  var API_URL = "https://script.google.com/macros/s/AKfycbweZkDzHdJWpecc3Zp21jL89FnJwjhAeRw6n5c01ki23ijMIWV7ero90QzxUOLKjoEd7w/exec";

  var TIMEOUT_MS = 25000;
  var $ = function(id){ return document.getElementById(id); };
  var busy = false;

  function esc(v){
    return String(v == null ? "" : v).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function flag(id, on){ $(id).classList.toggle("err", !!on); }
  function box(kind, html){ $("out").innerHTML = '<div class="box ' + kind + '">' + html + '</div>'; }

  function prettyPhone(raw){
    var d = String(raw || "").replace(/\D/g, "");
    if (d.length === 11 && d.charAt(0) === "1") d = d.slice(1);
    if (d.length === 10) return "(" + d.slice(0,3) + ") " + d.slice(3,6) + "-" + d.slice(6);
    return raw;
  }

  function copyText(text, btn){
    function done(ok){
      btn.textContent = ok ? "Copied!" : "Copy failed";
      setTimeout(function(){ btn.textContent = "Copy number"; }, 2000);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ done(false); });
    } else {
      try {
        var ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        done(ok);
      } catch(e){ done(false); }
    }
  }

  $("zipcode").addEventListener("input", function(){
    this.value = this.value.replace(/\D/g, "").slice(0, 5);
  });

  ["service","cid","zipcode"].forEach(function(id){
    $(id).addEventListener("input", function(){ flag(id, false); });
    $(id).addEventListener("change", function(){ flag(id, false); });
  });

  $("rtbForm").addEventListener("submit", function(ev){
    ev.preventDefault();
    if (busy) return;
    $("out").innerHTML = "";

    var service = $("service").value;
    var cid = $("cid").value.trim().replace(/\D/g, "");
    var zip = $("zipcode").value.trim();

    var problems = [];
    flag("service", !service);
    flag("cid", !cid);
    flag("zipcode", !/^\d{5}$/.test(zip));
    if (!service) problems.push("a service");
    if (!cid) problems.push("a Caller ID (CID)");
    if (!/^\d{5}$/.test(zip)) problems.push("a 5-digit ZIP code");
    if (problems.length) {
      box("bad", "Please enter " + problems.join(", ") + ".");
      return;
    }

    if (!API_URL || API_URL.indexOf("PASTE_") === 0) {
      box("bad", "Form is not connected yet. Paste your Apps Script Web App URL in the code.");
      return;
    }

    busy = true;
    $("submitBtn").disabled = true;
    $("submitBtn").textContent = "Sending…";

    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var to = setTimeout(function(){ if (ctrl) ctrl.abort(); }, TIMEOUT_MS);

    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ service: service, cid: cid, zipcode: zip }),
      signal: ctrl ? ctrl.signal : undefined
    })
    .then(function(r){ return r.text(); })
    .then(function(t){
      var d;
      try { d = JSON.parse(t); } catch(e){ throw new Error("Unexpected reply from server."); }
      return d;
    })
    .then(function(d){
      if (d.success) {
        var r = d.response || {};
        if (typeof r === "string") {
          try { r = JSON.parse(r); } catch(e){ r = {}; }
        }

        var phone = r.phoneNumber || r.phoneNumberNoPlus || "";
        var bid = r.bidAmount != null ? r.bidAmount : null;
        var expire = r.expireInSeconds != null ? r.expireInSeconds : null;
        var bidId = r.bidId || "";

        // Buffer time = min call duration from bidTerms (code 100)
        var buffer = null;
        if (Array.isArray(r.bidTerms)) {
          for (var i = 0; i < r.bidTerms.length; i++) {
            if (r.bidTerms[i] && r.bidTerms[i].callMinDuration != null) {
              buffer = r.bidTerms[i].callMinDuration;
              break;
            }
          }
        }

        var rawJson = JSON.stringify(r, null, 2);
        var html = "";

        // DID
        if (phone) {
          html += '<div class="did-label">Transfer the caller to</div>';
          html += '<div class="number" id="didNum">' + esc(prettyPhone(phone)) + '</div>';
          html += '<button class="btn ghost" id="copyBtn" type="button" style="margin-top:6px">Copy number</button>';
        } else {
          html += '<div class="line"><span>Result</span><b>Sent</b></div>';
        }

        // Bid / Expire / Buffer
        html += '<div class="bid-row">';
        if (bid != null) {
          html += '<div><div class="bid-label">Bid amount</div><div class="bid-amount">$' + esc(bid) + '</div></div>';
        }
        if (expire != null) {
          html += '<div><div class="bid-label">Expires in</div><div style="font-weight:600;color:var(--ink)">' + esc(expire) + 's</div></div>';
        }
        if (buffer != null) {
          html += '<div><div class="bid-label">Buffer time</div><div style="font-weight:600;color:var(--ink)">' + esc(buffer) + 's</div></div>';
        }
        html += '</div>';

        // Meta
        html += '<div class="meta">';
        html += 'Service: <b style="color:var(--ink)">' + esc(service) + '</b>';
        if (bidId) html += ' · Bid ID: <b style="color:var(--ink);font-size:11px">' + esc(bidId) + '</b>';
        html += '</div>';

        // RAW toggle (hidden by default)
        html += '<button type="button" class="raw-toggle" id="rawToggle">Show RAW API response</button>';
        html += '<pre class="raw-box" id="rawBox">' + esc(rawJson) + '</pre>';

        box("good", html);

        if (phone) {
          var copyBtn = $("copyBtn");
          if (copyBtn) {
            var raw = String(phone).replace(/\D/g, "");
            if (raw.length === 11 && raw.charAt(0) === "1") raw = raw.slice(1);
            copyBtn.addEventListener("click", function(){ copyText(raw.length === 10 ? "+1" + raw : phone, copyBtn); });
          }
        }

        var rawToggle = $("rawToggle");
        var rawBox = $("rawBox");
        if (rawToggle && rawBox) {
          rawToggle.addEventListener("click", function(){
            var open = rawBox.classList.toggle("open");
            rawToggle.textContent = open ? "Hide RAW API response" : "Show RAW API response";
          });
        }
      } else {
        box("bad", esc(d.error || "Request failed."));
      }
    })
    .catch(function(e){
      var msg = (e && e.name === "AbortError") ? "Request timed out." :
                (e && /Failed to fetch|NetworkError|Load failed/i.test(e.message))
                  ? "Could not reach the server. Check your connection."
                  : (e.message || "Something went wrong.");
      box("bad", esc(msg));
    })
    .finally(function(){
      clearTimeout(to);
      busy = false;
      $("submitBtn").disabled = false;
      $("submitBtn").textContent = "Submit";
    });
  });
})();
</script>
</body>
</html>
