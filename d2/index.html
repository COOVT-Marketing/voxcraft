<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ringba RTB Transfer</title>
<style>
  :root{
    --bg:#f3f4f6; --panel:#ffffff; --ink:#111827; --sub:#6b7280; --line:#d9dce1;
    --accent:#1d4ed8; --accent-d:#1e40af; --good:#166534; --good-bg:#ecfdf3; --good-line:#b7e4c7;
    --bad:#991b1b; --bad-bg:#fef2f2; --bad-line:#f5c2c2;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:baseline;gap:10px}
  header b{font-size:17px;letter-spacing:.2px}
  header span{color:var(--sub);font-size:12.5px}
  main{max-width:520px;margin:22px auto;padding:0 14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:14px}
  .panel h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--sub);font-weight:600}
  label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
  label:first-of-type{margin-top:0}
  input,select{width:100%;height:38px;padding:0 10px;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px}
  input::placeholder{color:#9aa1ad}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,78,216,.15)}
  input.err,select.err{border-color:#dc2626}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:460px){.two{grid-template-columns:1fr}}
  .note{font-size:12px;color:var(--sub);margin-top:4px}
  .btn{display:block;width:100%;height:40px;margin-top:16px;border:0;border-radius:6px;background:var(--accent);color:#fff;font:600 14px inherit;font-family:inherit;cursor:pointer}
  .btn:hover:not(:disabled){background:var(--accent-d)}
  .btn:disabled{opacity:.55;cursor:default}
  .box{margin-top:14px;padding:11px 13px;border-radius:6px;border:1px solid;font-size:13.5px}
  .box.good{background:var(--good-bg);border-color:var(--good-line);color:var(--good)}
  .box.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
  .line{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
  .line + .line{border-top:1px solid rgba(22,101,52,.15)}
  .line span{color:#3f6b4f}
  .line b{color:var(--ink);font-weight:600;text-align:right;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
  <b>Ringba RTB Transfer</b>
  <span>Windows · Bath · Roofing</span>
</header>

<main>
  <section class="panel">
    <h2>Send Transfer</h2>
    <form id="rtbForm" novalidate autocomplete="off">
      <label for="service">Service</label>
      <select id="service" required>
        <option value="" disabled selected>Select service</option>
        <option value="windows">Windows</option>
        <option value="bath">Bath</option>
        <option value="roofing">Roofing</option>
      </select>

      <div class="two">
        <div>
          <label for="cid">Caller ID (CID)</label>
          <input id="cid" type="tel" inputmode="tel" placeholder="18885557777">
        </div>
        <div>
          <label for="zipcode">ZIP code</label>
          <input id="zipcode" type="text" inputmode="numeric" maxlength="5" placeholder="99999">
        </div>
      </div>

      <button class="btn" id="submitBtn" type="submit">Send Transfer</button>
    </form>

    <div id="out" aria-live="polite"></div>
  </section>
</main>

<script>
(function(){
  "use strict";

  // ★★★ PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE ★★★
  // (ends with /exec)
  var API_URL = "PASTE_YOUR_APPS_SCRIPT_URL_HERE";

  var TIMEOUT_MS = 25000;
  var $ = function(id){ return document.getElementById(id); };
  var busy = false;

  function esc(v){
    return String(v == null ? "" : v).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function flag(id, on){ $(id).classList.toggle("err", !!on); }
  function box(kind, html){ $("out").innerHTML = '<div class="box ' + kind + '">' + html + '</div>'; }

  $("zipcode").addEventListener("input", function(){
    this.value = this.value.replace(/\D/g, "").slice(0, 5);
  });

  ["service","cid","zipcode"].forEach(function(id){
    $(id).addEventListener("input", function(){ flag(id, false); });
    $(id).addEventListener("change", function(){ flag(id, false); });
  });

  $("rtbForm").addEventListener("submit", function(ev){
    ev.preventDefault();
    if (busy) return;
    $("out").innerHTML = "";

    var service = $("service").value;
    var cid = $("cid").value.trim().replace(/\D/g, "");
    var zip = $("zipcode").value.trim();

    var problems = [];
    flag("service", !service);
    flag("cid", !cid);
    flag("zipcode", !/^\d{5}$/.test(zip));
    if (!service) problems.push("a service");
    if (!cid) problems.push("a Caller ID (CID)");
    if (!/^\d{5}$/.test(zip)) problems.push("a 5-digit ZIP code");
    if (problems.length) {
      box("bad", "Please enter " + problems.join(", ") + ".");
      return;
    }

    if (!API_URL || API_URL.indexOf("PASTE_") === 0) {
      box("bad", "Form is not connected yet. Paste your Apps Script Web App URL in the code.");
      return;
    }

    busy = true;
    $("submitBtn").disabled = true;
    $("submitBtn").textContent = "Sending…";

    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var to = setTimeout(function(){ if (ctrl) ctrl.abort(); }, TIMEOUT_MS);

    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ service: service, cid: cid, zipcode: zip }),
      signal: ctrl ? ctrl.signal : undefined
    })
    .then(function(r){ return r.text(); })
    .then(function(t){
      var d;
      try { d = JSON.parse(t); } catch(e){ throw new Error("Unexpected reply from server."); }
      return d;
    })
    .then(function(d){
      if (d.success) {
        var rows = '<div class="line"><span>Result</span><b>Sent</b></div>'
                 + '<div class="line"><span>Service</span><b>' + esc(service) + '</b></div>'
                 + '<div class="line"><span>Status</span><b>' + esc(d.status || "OK") + '</b></div>';
        if (d.response != null) {
          var respStr = typeof d.response === "object" ? JSON.stringify(d.response) : String(d.response);
          rows += '<div class="line"><span>Response</span><b style="font-size:11px;text-align:left">' + esc(respStr) + '</b></div>';
        }
        box("good", rows);
      } else {
        box("bad", esc(d.error || "Request failed."));
      }
    })
    .catch(function(e){
      var msg = (e && e.name === "AbortError") ? "Request timed out." :
                (e && /Failed to fetch|NetworkError|Load failed/i.test(e.message))
                  ? "Could not reach the server. Check your connection."
                  : (e.message || "Something went wrong.");
      box("bad", esc(msg));
    })
    .finally(function(){
      clearTimeout(to);
      busy = false;
      $("submitBtn").disabled = false;
      $("submitBtn").textContent = "Send Transfer";
    });
  });
})();
</script>
</body>
</html>
